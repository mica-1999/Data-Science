preprocessing:
  csv_path: "../../ProjectDatasets/flights_sample_3m.csv"  # Path to CSV
  distance_range:
      min: 50
      max: 5500
  future_columns:
    - DEP_DELAY
    - DELAY_DUE_CARRIER
    - DELAY_DUE_WEATHER
    - DELAY_DUE_NAS
    - DELAY_DUE_SECURITY
    - DELAY_DUE_LATE_AIRCRAFT
    - ARR_TIME
    - DEP_TIME
    - WHEELS_OFF
    - WHEELS_ON
    - TAXI_OUT
    - TAXI_IN
    - ELAPSED_TIME
    - AIR_TIME
    - CANCELLED
    - CANCELLATION_CODE
    - DIVERTED
    - AIRLINE_DOT
    - DOT_CODE
    - FL_NUMBER
    - ORIGIN_CITY
    - DEST_CITY
    - AIRLINE
  numeric_columns_for_outliers:
    - CRS_ELAPSED_TIME
  scaling_columns:
    - CRS_ELAPSED_TIME
    - DISTANCE
    - CRS_DEP_TIME
    - CRS_ARR_TIME
  output_path_cleaned: "../../ProjectDatasets/flights_cleaned.csv"